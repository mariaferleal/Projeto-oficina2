name: Testes

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: npm ci
      - name: Rodar testes
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: npm test --if-present

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        if: ${{ hashFiles('backend/package-lock.json') != '' }}
        run: npm ci

      # Executa o script de coverage configurado no package.json
      - name: Rodar testes com cobertura
        if: ${{ hashFiles('backend/package-lock.json') != '' }}
        run: npm run test:coverage

      # Publica o relatório HTML e arquivos de cobertura como artefato para download
      - name: Publicar relatório de cobertura como artefato
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('backend/package-lock.json') != ''
        with:
          name: backend-coverage-report
          path: backend/coverage/

      # Lê o coverage-summary.json e renderiza a tabela no resumo da execução do CI
      - name: Exibir percentual de cobertura no resumo do CI
        if: always() && hashFiles('backend/package-lock.json') != ''
        run: |
          echo "### 📊 Cobertura de Testes - Backend" >> $GITHUB_STEP_SUMMARY
          node -e "
            const fs = require('fs');
            const summaryPath = 'coverage/coverage-summary.json';
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
              console.log('| Métrica | Percentual |');
              console.log('| :--- | :--- |');
              console.log('| Linhas | ' + summary.lines.pct + '% |');
              console.log('| Funções | ' + summary.functions.pct + '% |');
              console.log('| Branches | ' + summary.branches.pct + '% |');
              console.log('| Declarações | ' + summary.statements.pct + '% |');
            } else {
              console.log('⚠️ Arquivo coverage-summary.json não encontrado.');
            }
          " >> $GITHUB_STEP_SUMMARY

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enquanto front e back não têm package.json, os containers não sobem; o job só roda depois disso
      - name: Verificar se front e back já existem
        id: apps
        run: |
          if [ -f frontend/package.json ] && [ -f backend/package.json ]; then echo "prontos=true" >> "$GITHUB_OUTPUT"; else echo "prontos=false" >> "$GITHUB_OUTPUT"; fi
      - name: Configurar Variáveis de Ambiente
        if: steps.apps.outputs.prontos == 'true'
        run: |
          echo "DB_TEST_USER=postgres" >> .env
          echo "DB_TEST_PASSWORD=admin" >> .env
          echo "DB_TEST_NAME=blocoBot_test_db" >> .env
          echo "DB_TEST_PORT=5433" >> .env

      - name: Subir containers de teste
        if: steps.apps.outputs.prontos == 'true'
        run: docker compose --profile test up -d --build

      - uses: actions/setup-node@v4
        if: steps.apps.outputs.prontos == 'true'
        with:
          node-version: 20

      - name: Instalar dependências do frontend
        if: steps.apps.outputs.prontos == 'true'
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright e dependências
        if: steps.apps.outputs.prontos == 'true'
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Executar testes de tela (Playwright)
        if: steps.apps.outputs.prontos == 'true'
        working-directory: tests
        run: npm run test

      - name: Desligar infraestrutura
        if: always() && steps.apps.outputs.prontos == 'true'
        run: docker compose --profile test down